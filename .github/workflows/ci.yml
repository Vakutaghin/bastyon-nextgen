# CI-гейт (аудит P3-1): lint + typecheck-baseline + vitest + сборка + Rust-тесты
# + сборка Windows с проверкой, что exe не требует рантайм Visual C++,
# на каждый push/PR. Без него регрессии уезжали в релизы: `vite build` не
# тайпчекает, тесты никто не запускал. vue-tsc проверяет и .vue; число ошибок
# не должно расти относительно typecheck-baseline.json (APP_AUDIT N28).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (не хуже baseline)
        run: pnpm typecheck:baseline

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          # libdbus-1-dev: с 2.11 Tauri узнаёт тему на Linux через D-Bus (libdbus-sys).
          # libasound2-dev — микрофон голосового ввода (cpal/ALSA), libclang-dev —
          # bindgen при сборке whisper.cpp (src/asr).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libasound2-dev libclang-dev

      # --workspace: и крейты узла Reticulum (src-tauri/crates).
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace --lib

  # Windows: программа не должна требовать рантайм Visual C++ (MSVCP140.dll) —
  # на чистой Windows его нет, и до crt-static (.cargo/config.toml) приложение
  # там не запускалось. Сборка как в релизе: STATIC_VCRUNTIME ставит tauri-cli.
  # Фронт не нужен: без фичи custom-protocol Tauri его не встраивает.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build
        working-directory: src-tauri
        env:
          STATIC_VCRUNTIME: 'true'
        run: cargo build --release --locked

      - name: Check native dependencies
        shell: bash
        run: scripts/check-native-deps.sh src-tauri/target/release/app.exe
