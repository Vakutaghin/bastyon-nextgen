# Сборка релизных бинарей для всех платформ и аттач к GitHub Release.
#
# Триггер:
#   - автоматически на push тега вида `v*` (например, v0.1.0)
#   - вручную через Actions → Release → Run workflow с указанием существующего тега;
#     с android_only пересобирается только APK, десктопные файлы релиза остаются
#
# Платформы:
#   - desktop (Tauri): macOS arm64, macOS x64, Linux (Ubuntu 22.04), Windows
#   - mobile (Capacitor): Android APK, подписанный постоянным ключом из секретов
#
# Имена файлов задаются здесь, а не tauri-action: у неё они вида
# `Bastyon.NextGen_0.3.0_aarch64.dmg` — по такому имени человек не понимает, что
# качать. Здесь платформа идёт ПЕРВОЙ, поэтому сортировка по алфавиту сама
# группирует файлы по системам.
#
# Релиз создаёт отдельная джоба до сборок: tauri-action больше не создаёт его
# сама (иначе она же и заливала бы файлы под своими именами), а android раньше
# падал на `release not found`, если добегал первым.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег для сборки (например, v0.1.0)'
        required: true
        type: string
      android_only:
        description: 'Только Android: десктопные файлы релиза не пересобирать'
        required: false
        type: boolean
        default: false

# При обоих триггерах нужен один способ узнать целевой тег.
# При push -> github.ref_name (e.g. v0.1.0). При dispatch -> inputs.tag.
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Сборке фронта нужно ~2,5 ГБ кучи: plugin-legacy разбирает каждый чанк
  # Babel, чтобы подобрать полифилы. Node сам даёт четверть памяти машины, а у
  # macOS-раннера её 7 ГБ — в 0.9.5 обе сборки macOS упали с heap out of memory.
  # Тот же лимит стоит в скрипте build (package.json); здесь он для тегов, у
  # которых его в скрипте ещё нет.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Тело релиза собирает тот же скрипт, которым его можно перегенерировать
      # руками: инструкция «что скачать и как поставить» на двух языках плюс
      # заметки из changelogs/<tag>/.
      #
      # Новый релиз — черновик: в releases/latest (проверка обновлений в
      # приложении, latest.json апдейтера) он попадёт только из джобы publish,
      # когда все сборки зальют файлы. Раньше релиз публиковался сразу, и
      # пока шли сборки, «последней» была версия без установщиков.
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-body.sh
          ./scripts/release-body.sh "$TAG" > /tmp/release-body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-body.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-body.md \
              --draft --verify-tag
          fi

  desktop:
    needs: create-release
    if: ${{ !inputs.android_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            variant: Apple-Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            variant: Intel
          - platform: ubuntu-22.04
            args: ''
            variant: x86_64
          - platform: windows-latest
            args: ''
            variant: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # pnpm — единственный менеджер проекта (pnpm-lock.yaml + pnpm.overrides).
      # Раньше здесь стоял npm по устаревшему package-lock.json — сборка релиза
      # не проходила (аудит V41/P3-1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Windows: Node 20 надёжнее для нативных пакетов (canvas / hex-captcha)
          node-version: ${{ matrix.platform == 'windows-latest' && '20' || 'lts/*' }}
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: с 2.11 Tauri узнаёт тему на Linux через D-Bus (libdbus-sys).
          # libasound2-dev — микрофон голосового ввода (cpal/ALSA), libclang-dev —
          # bindgen при сборке whisper.cpp (src/asr).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libasound2-dev libclang-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Постоянный самоподписанный сертификат (scripts/macos-signing-key.sh).
      # Gatekeeper встречает такое приложение так же, как ad-hoc, но требование
      # подписи у всех версий одно: `identifier "com.bastyon.app" and
      # certificate leaf = H"…"`. У ad-hoc это хэш сборки, и после каждого
      # обновления macOS снова спрашивала пароль, чтобы пустить приложение к
      # ключу сейфа в Связке ключей (его держит WebKit), и заново просила
      # микрофон и камеру. Без секрета сборка падает, а не откатывается к
      # ad-hoc: иначе вопросы молча вернулись бы. С Developer ID в секретах
      # подписывает он (шаг ниже).
      - name: macOS signing identity (permanent, self-signed)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Задан Developer ID — подписывает он"
            exit 0
          fi
          if [ -z "$MACOS_SIGNING_P12_B64" ] || [ -z "$MACOS_SIGNING_P12_PASSWORD" ]; then
            echo "::error::Нет MACOS_SIGNING_P12_B64/MACOS_SIGNING_P12_PASSWORD — см. scripts/macos-signing-key.sh" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/bastyon-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/bastyon-signing.p12"
          printf '%s' "$MACOS_SIGNING_P12_B64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          # codesign ищет подпись только в связках из списка поиска.
          existing="$(security list-keychains -d user | tr -d '"')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          # Переменная окружения главнее signingIdentity "-" из tauri.conf.json.
          echo "APPLE_SIGNING_IDENTITY=Bastyon NextGen" >> "$GITHUB_ENV"
          echo "BASTYON_SELF_SIGNED=1" >> "$GITHUB_ENV"

      # Developer ID (если появится): Tauri подпишет им и отправит сборку на
      # нотаризацию — тогда macOS не спросит про неизвестного разработчика.
      # Пустую переменную Tauri считает заданной и пытается ею подписать,
      # поэтому передаём только заполненные.
      - name: Apple signing and notarization (when configured)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Секретов Apple нет: подпись ad-hoc, без нотаризации"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Секрет $name не задан, а APPLE_CERTIFICATE задан" >&2
              exit 1
            fi
            delimiter="EOF_$(openssl rand -hex 8)"
            { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done

      # Без tagName/releaseName action только собирает и ничего не заливает.
      # tauri.updater.conf.json включает файлы обновления (.app.tar.gz на macOS,
      # подписи .sig рядом с .msi и .AppImage): их подписывает ключ из
      # TAURI_SIGNING_PRIVATE_KEY (scripts/updater-signing-key.sh), а приложение
      # проверяет открытым ключом из tauri.conf.json. Без ключа сборка падает.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      # Собранная программа запустится на чистой системе: на macOS только
      # системные библиотеки (liblzma из Homebrew раннера не давала 0.9.0–0.9.4
      # запуститься на Apple Silicon), на Windows без рантайма Visual C++
      # (MSVCP140.dll, которого нет на чистой Windows). См. scripts/check-native-deps.sh.
      - name: Check native dependencies
        if: matrix.platform != 'ubuntu-22.04'
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = macos-latest ]; then
            bundle_dir="src-tauri/target/${ARGS#--target }/release/bundle/macos"
            app="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' | head -n 1)"
            [ -n "$app" ] || { echo "::error::Не найден собранный .app" >&2; exit 1; }
            scripts/check-native-deps.sh "$app"
          else
            scripts/check-native-deps.sh src-tauri/target/release/app.exe
          fi

      # Подписано именно постоянным сертификатом: иначе после обновления
      # macOS снова спросит пароль связки ключей и доступ к микрофону.
      - name: Check the macOS signing certificate
        if: matrix.platform == 'macos-latest' && env.BASTYON_SELF_SIGNED == '1'
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < src-tauri/macos-signing-cert.sha1)"
          # Только бандл этой сборки (args = --target <triple>), не из кэша.
          bundle_dir="src-tauri/target/${ARGS#--target }/release/bundle/macos"
          app="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' | head -n 1)"
          [ -n "$app" ] || { echo "::error::Не найден собранный .app" >&2; exit 1; }
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          if ! grep -q "certificate leaf = H\"$expected\"" <<<"$requirement"; then
            echo "::error::$app подписан не постоянным сертификатом: $requirement" >&2
            exit 1
          fi
          echo "Подпись: $requirement"

      # Файл обновления для апдейтера в приложении: на macOS — .app.tar.gz
      # (заливается рядом с dmg), на Windows и Linux — сами .msi и .AppImage.
      # Его подпись (.sig рядом) и адрес в релизе уходят записью в
      # updater-<variant>.json, из записей джоба publish собирает latest.json.
      # `rw.*.dmg` — промежуточный образ упаковщика в bundle/macos/: если он
      # переживёт сборку, find возьмёт его вместо готового dmg.
      - name: Rename installers and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
          PLATFORM: ${{ matrix.platform }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="release-assets"
          mkdir -p "$OUT"
          updater_asset=""
          updater_sig=""

          while IFS= read -r f; do
            asset=""
            case "$f" in
              *.dmg)        asset="macOS-Bastyon-NextGen-${VERSION}-${VARIANT}.dmg" ;;
              *.app.tar.gz) asset="macOS-Bastyon-NextGen-${VERSION}-${VARIANT}.app.tar.gz" ;;
              *.msi)        asset="Windows-Bastyon-NextGen-${VERSION}-${VARIANT}.msi" ;;
              *.AppImage)   asset="Linux-Bastyon-NextGen-${VERSION}-${VARIANT}.AppImage" ;;
              *.deb)        asset="Linux-Bastyon-NextGen-${VERSION}-${VARIANT}.deb" ;;
            esac
            cp "$f" "$OUT/$asset"
            case "$f" in
              *.app.tar.gz | *.msi | *.AppImage)
                updater_asset="$asset"
                updater_sig="$f.sig"
                ;;
            esac
          done < <(find src-tauri/target -type f \
                     ! -name 'rw.*' \
                     \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.msi' \
                        -o -name '*.AppImage' -o -name '*.deb' \))

          if [ -z "$(ls -A "$OUT")" ]; then
            echo "Не найдено ни одного установщика — сборка что-то не положила в bundle/" >&2
            find src-tauri/target -type d -name bundle >&2 || true
            exit 1
          fi
          if [ -z "$updater_asset" ] || [ ! -s "$updater_sig" ]; then
            echo "::error::Нет файла обновления или его подписи (.sig): задан ли TAURI_SIGNING_PRIVATE_KEY?" >&2
            exit 1
          fi

          case "$PLATFORM/$VARIANT" in
            macos-latest/Apple-Silicon) key=darwin-aarch64 ;;
            macos-latest/Intel)         key=darwin-x86_64 ;;
            ubuntu-22.04/x86_64)        key=linux-x86_64 ;;
            windows-latest/x64)         key=windows-x86_64 ;;
            *) echo "::error::Неизвестная система $PLATFORM/$VARIANT" >&2; exit 1 ;;
          esac
          KEY="$key" SIG="$updater_sig" \
          URL="https://github.com/$REPO/releases/download/$TAG/$updater_asset" \
            node -e '
              const fs = require("fs")
              const { KEY, SIG, URL } = process.env
              const entry = { signature: fs.readFileSync(SIG, "utf8").trim(), url: URL }
              fs.writeFileSync(`updater-${process.env.VARIANT}.json`, JSON.stringify({ [KEY]: entry }))
            '

          ls -la "$OUT"
          gh release upload "$TAG" "$OUT"/* --clobber

      - name: Keep the update record for latest.json
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.variant }}
          path: updater-${{ matrix.variant }}.json
          if-no-files-found: error

  android:
    permissions:
      contents: write
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies and build web bundle
        env:
          # Сборка для Capacitor: сервис-воркер PWA там только вредит (vite.config.js).
          VITE_CAPACITOR: 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      # Узел Reticulum (src-tauri/crates/bastyon-rns-jni): Gradle собирает его
      # scripts/build-rns-android.sh под NDK раннера. Без Rust APK собрался бы
      # без узла.
      - name: Install Rust for the Reticulum node
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      # Android ставит новую версию поверх старой, только если обе подписаны
      # одним ключом. До 0.7.1 включительно здесь собирался debug-APK, а
      # отладочный ключ на каждом раннере свой, поэтому любое обновление
      # требовало удалить приложение вместе с ключами аккаунтов. Теперь APK
      # релизный и подписан постоянным ключом из секретов, созданных один раз
      # скриптом scripts/android-signing-key.sh.
      #
      # Без ключа джоба падает, а не собирает debug по-старому: такой APK снова
      # не встал бы поверх, и он debuggable — данные кошелька читаются через adb.
      # По той же причине падает и APK с чужим сертификатом: отпечаток ключа
      # записан в android/app/release-cert.sha256. ANDROID_KEY_ALIAS и
      # ANDROID_KEY_PASSWORD нужны только для ключа, сделанного не этим скриптом.
      - name: Build the signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Нет ключа подписи Android: секретов ANDROID_KEYSTORE_B64 и ANDROID_KEYSTORE_PASSWORD. Их создают один раз: scripts/android-signing-key.sh"
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          CERTS="$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$CERTS"
          # Строки apksigner бывают «Signer #1 certificate …» и «V2 Signer:
          # certificate …» (так печатает build-tools 36): берём отпечатки из всех,
          # и все они должны совпасть с записанным — лишний подписант тоже провал.
          CERT="$(sed -n -E 's/^.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' <<<"$CERTS" | sort -u)"
          EXPECTED="$(tr -d '[:space:]' < app/release-cert.sha256)"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::APK подписан не тем ключом: SHA-256 ${CERT:-не найден}, а в android/app/release-cert.sha256 записан $EXPECTED"
            exit 1
          fi

      - name: Rename APK and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="Android-Bastyon-NextGen-${VERSION}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$OUT"
          gh release upload "$TAG" "$OUT" --clobber

  # Последний шаг: latest.json для апдейтера в приложении и публикация
  # черновика. Если хоть одна сборка упала, релиз остаётся черновиком — не
  # «последним» без установщиков. Пересборка одного APK (android_only) идёт по
  # уже опубликованному релизу, ей это не нужно.
  publish:
    needs: [desktop, android]
    if: ${{ !inputs.android_only }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Collect the update records
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-records
          merge-multiple: true

      - name: Upload latest.json and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/updater-manifest.mjs "$TAG" updater-records > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
          gh release edit "$TAG" --draft=false --latest
