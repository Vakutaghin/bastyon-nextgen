# Сборка релизных бинарей для всех платформ и аттач к GitHub Release.
#
# Триггер:
#   - автоматически на push тега вида `v*` (например, v0.1.0)
#   - вручную через Actions → Release → Run workflow с указанием существующего тега
#
# Платформы:
#   - desktop (Tauri): macOS arm64, macOS x64, Linux (Ubuntu 22.04), Windows
#   - mobile (Capacitor): Android debug APK (без релизного keystore — позже)
#
# Имена файлов задаются здесь, а не tauri-action: у неё они вида
# `Bastyon.NextGen_0.3.0_aarch64.dmg` — по такому имени человек не понимает, что
# качать. Здесь платформа идёт ПЕРВОЙ, поэтому сортировка по алфавиту сама
# группирует файлы по системам.
#
# Релиз создаёт отдельная джоба до сборок: tauri-action больше не создаёт его
# сама (иначе она же и заливала бы файлы под своими именами), а android раньше
# падал на `release not found`, если добегал первым.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий тег для сборки (например, v0.1.0)'
        required: true
        type: string

# При обоих триггерах нужен один способ узнать целевой тег.
# При push -> github.ref_name (e.g. v0.1.0). При dispatch -> inputs.tag.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Тело релиза собирает тот же скрипт, которым его можно перегенерировать
      # руками: инструкция «что скачать и как поставить» на двух языках плюс
      # заметки из changelogs/<tag>/.
      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/release-body.sh
          ./scripts/release-body.sh "$TAG" > /tmp/release-body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file /tmp/release-body.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-body.md
          fi

  desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            variant: Apple-Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            variant: Intel
          - platform: ubuntu-22.04
            args: ''
            variant: x86_64
          - platform: windows-latest
            args: ''
            variant: x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # pnpm — единственный менеджер проекта (pnpm-lock.yaml + pnpm.overrides).
      # Раньше здесь стоял npm по устаревшему package-lock.json — сборка релиза
      # не проходила (аудит V41/P3-1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Windows: Node 20 надёжнее для нативных пакетов (canvas / hex-captcha)
          node-version: ${{ matrix.platform == 'windows-latest' && '20' || 'lts/*' }}
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # macOS: без секретов Apple бандл подписывается ad-hoc (signingIdentity "-"
      # в tauri.conf.json). Такое приложение macOS не называет повреждённым, но
      # первый запуск разрешают в «Конфиденциальность и безопасность» — оно не
      # нотаризовано. С сертификатом Developer ID в секретах репозитория Tauri
      # подпишет им и отправит сборку на нотаризацию. Пустую переменную Tauri
      # считает заданной и пытается ею подписать, поэтому передаём только
      # заполненные.
      - name: Apple signing and notarization (when configured)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Секретов Apple нет: подпись ad-hoc, без нотаризации"
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Секрет $name не задан, а APPLE_CERTIFICATE задан" >&2
              exit 1
            fi
            delimiter="EOF_$(openssl rand -hex 8)"
            { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
          done

      # Без tagName/releaseName action только собирает и ничего не заливает.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # `.app.tar.gz` сознательно не заливаем: это артефакты Tauri-апдейтера,
      # который не настроен, а человеку они выглядят как ещё один установщик.
      # `rw.*.dmg` — промежуточный образ упаковщика в bundle/macos/: если он
      # переживёт сборку, find возьмёт его вместо готового dmg.
      - name: Rename installers and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="release-assets"
          mkdir -p "$OUT"

          while IFS= read -r f; do
            case "$f" in
              *.dmg)      cp "$f" "$OUT/macOS-Bastyon-NextGen-${VERSION}-${VARIANT}.dmg" ;;
              *.msi)      cp "$f" "$OUT/Windows-Bastyon-NextGen-${VERSION}-${VARIANT}.msi" ;;
              *.AppImage) cp "$f" "$OUT/Linux-Bastyon-NextGen-${VERSION}-${VARIANT}.AppImage" ;;
              *.deb)      cp "$f" "$OUT/Linux-Bastyon-NextGen-${VERSION}-${VARIANT}.deb" ;;
            esac
          done < <(find src-tauri/target -type f \
                     ! -name 'rw.*' \
                     \( -name '*.dmg' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \))

          if [ -z "$(ls -A "$OUT")" ]; then
            echo "Не найдено ни одного установщика — сборка что-то не положила в bundle/" >&2
            find src-tauri/target -type d -name bundle >&2 || true
            exit 1
          fi

          ls -la "$OUT"
          gh release upload "$TAG" "$OUT"/* --clobber

  android:
    permissions:
      contents: write
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies and build web bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      # TODO: для production-релизов подключить релизный keystore (через secrets
      # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
      # ANDROID_KEY_PASSWORD) и заменить assembleDebug на assembleRelease.
      # Сейчас shipим debug-APK — он установится, но подпись runner-специфична,
      # поэтому in-place upgrade между релизами не сработает.
      - name: Build Android debug APK (unsigned for now)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          OUT="Android-Bastyon-NextGen-${VERSION}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          gh release upload "$TAG" "$OUT" --clobber
