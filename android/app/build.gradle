apply plugin: 'com.android.application'

// Постоянный ключ подписи релизного APK. Android ставит новую версию поверх
// старой, только если обе подписаны одним ключом, а отладочный ключ на каждом
// CI-раннере свой. Файл ключа workflow релиза берёт из секретов репозитория,
// куда его один раз кладёт scripts/android-signing-key.sh.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace = "com.bastyon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bastyon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 47
        versionName "0.23.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'bastyon'
                // В PKCS12 у ключа тот же пароль, что у хранилища.
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Библиотеки распаковываются при установке: tor и lyrebird (libtor.so,
    // liblyrebird.so) — программы, Android запускает их только из каталога
    // библиотек на диске. Без распаковки они лежали бы внутри APK.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Узел Reticulum (src-tauri/crates/bastyon-rns-jni): .so собирает cargo под
// NDK перед сборкой APK. Без cargo или NDK скрипт только предупреждает — APK
// соберётся без узла.
def rnsScript = rootProject.file('../scripts/build-rns-android.sh')
tasks.register('buildRnsNative', Exec) {
    onlyIf { rnsScript.exists() && System.getenv('BASTYON_SKIP_RNS') == null }
    commandLine 'bash', rnsScript.absolutePath
}
preBuild.dependsOn 'buildRnsNative'

// Голосовой ввод (src-tauri/crates/bastyon-asr-jni): whisper.cpp под NDK, тем же
// cargo. Без cargo, NDK или cmake скрипт только предупреждает — APK соберётся
// без голосового ввода, кнопки диктовки в нём не будет.
def asrScript = rootProject.file('../scripts/build-asr-android.sh')
tasks.register('buildAsrNative', Exec) {
    onlyIf { asrScript.exists() && System.getenv('BASTYON_SKIP_ASR') == null }
    commandLine 'bash', asrScript.absolutePath
}
preBuild.dependsOn 'buildAsrNative'

// Tor (src-tauri/crates/bastyon-tor-jni и tor-expert-bundle для Android из
// src-tauri/src/tor/bundle.json): входит в APK, не скачивается. Без cargo,
// NDK или бандла скрипт только предупреждает — APK соберётся без Tor.
def torScript = rootProject.file('../scripts/build-tor-android.sh')
tasks.register('buildTorNative', Exec) {
    onlyIf { torScript.exists() && System.getenv('BASTYON_SKIP_TOR') == null }
    commandLine 'bash', torScript.absolutePath
}
preBuild.dependsOn 'buildTorNative'

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.media:media:$androidxMediaVersion"
    // Прокси WebView под Tor (plugins/tor/TorNetwork). Та же версия, что у Capacitor.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Звук ролика, пока приложение свёрнуто или экран погашен: WebView в фоне
    // видео не играет (MediaPlaybackService). Только плеер и HLS.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    // Mesh-радио по USB: CDC-ACM, CP210x, CH34x, FTDI (MIT).
    implementation "com.github.mik3y:usb-serial-for-android:3.11.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
