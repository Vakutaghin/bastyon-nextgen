<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="description" content="Bastyon — децентрализованная социальная сеть на блокчейне: посты, видео, мессенджер, мини-приложения и кошелёк PKOIN. Без посредников и SSO." />

    <!--
      Content Security Policy — стартовая планка.
      Запрещаем object/embed, левую base-href и form-action; разрешаем wasm
      (tiny-secp256k1) и inline-стили (vue3-styled-components всё ещё injects их в <head>).
      Inline-скриптов нет — полифилл и error-listeners вынесены в src/polyfills.ts,
      что позволило снять 'unsafe-inline' с script-src.
      connect/img/media/frame оставлены широко на https:/wss: — Pocketnet ходит к множеству
      peertube-инстансов и пользовательских mini-apps; белый список хостов потребует
      отдельной инвентаризации.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <!-- Иконки и PWA-манифест -->
    <link rel="icon" type="image/png" href="/img/bastyon_logo_round.png" />
    <link rel="apple-touch-icon" href="/img/bastyon_logo_round.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Прогрев соединений к основным нодам Pocketnet -->
    <link rel="preconnect" href="https://1.pocketnet.app:8899" crossorigin />
    <link rel="dns-prefetch" href="https://2.pocketnet.app" />
    <link rel="dns-prefetch" href="https://3.pocketnet.app" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bastyon" />
    <meta property="og:title" content="Bastyon" />
    <meta property="og:description" content="Децентрализованная социальная сеть на блокчейне: посты, видео, мессенджер, мини-приложения и кошелёк PKOIN." />
    <meta property="og:image" content="/img/bastyon_logo_round.png" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bastyon" />
    <meta name="twitter:description" content="Децентрализованная социальная сеть на блокчейне: посты, видео, мессенджер, мини-приложения и кошелёк PKOIN." />
    <meta name="twitter:image" content="/img/bastyon_logo_round.png" />

    <title>Bastyon</title>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
