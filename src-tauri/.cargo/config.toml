# Голосовой ввод (whisper.cpp): переносимая сборка ggml. По умолчанию ggml
# собирается с -march=native под процессор сборочной машины, и релиз с
# раннера GitHub падал бы с illegal instruction на процессорах пользователей.
# С OFF на x86-64 включаются AVX2/FMA/F16C/BMI2 (процессоры с 2013 года;
# старые src/asr/engine.rs распознаёт и голосовой ввод на них не включает).
#
# Этот набор ggml включает сам только при сборке на x86-64. При кросс-сборке
# (Intel-мак собирается на ARM-раннере) он выключает все x86-расширения, и
# распознавание на Intel шло бы без SIMD, в разы медленнее. Поэтому набор
# задан явно. На ARM ggml эти флаги не читает.
[env]
GGML_NATIVE = "OFF"
GGML_SSE42 = "ON"
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_BMI2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"

# Windows: C-рантайм вшит в программу. Без этого C++-код whisper.cpp собирался с
# /MD и требовал MSVCP140.dll из пакета Visual C++ Redistributable, которого нет
# на чистой Windows, — приложение не запускалось. С crt-static cc и cmake
# собирают C/C++ с /MT. UCRT остаётся системной: её делает динамической
# static_vcruntime из tauri-build (часть Windows с 10, на 8.1 — обновление KB2999226).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
