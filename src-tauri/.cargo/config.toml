# Голосовой ввод (whisper.cpp): переносимая сборка ggml. По умолчанию ggml
# собирается с -march=native под процессор сборочной машины, и релиз с
# раннера GitHub падал бы с illegal instruction на процессорах пользователей.
# С OFF на x86-64 включаются AVX2/FMA/F16C/BMI2 (процессоры с 2013 года;
# старые src/asr/engine.rs распознаёт и голосовой ввод на них не включает).
[env]
GGML_NATIVE = "OFF"
