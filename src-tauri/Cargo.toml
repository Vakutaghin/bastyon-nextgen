# Крейты узла Reticulum: общий (десктоп и Android) и JNI-обёртка для Android.
# vendor/rns-net, vendor/rns-crypto — с правками (VENDORED.md в каждом): не
# члены workspace, подменяют версии с crates.io через [patch.crates-io] ниже.
[workspace]
members = ["crates/bastyon-rns", "crates/bastyon-rns-jni"]
exclude = ["vendor/rns-net", "vendor/rns-crypto"]

[package]
name = "app"
version = "0.9.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Инспектор WebView в release-сборке — ТОЛЬКО по явному запросу
# (`tauri build -- --features devtools`). В debug он доступен и без фичи.
# Раньше фича стояла безусловно: инспектор + ОС-глобальные хоткеи F12/Ctrl+Shift+I
# уезжали в прод (аудит P3-5/V19).
devtools = ["tauri/devtools"]
# Голосовой ввод: `BASTYON_ASR_FILE=фраза.wav` подменяет микрофон записью —
# для проверки всей цепочки без живой речи. В релиз не входит.
asr-file-source = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# Узел Reticulum (src/rns) — общий крейт с Android (crates/bastyon-rns).
bastyon-rns = { path = "crates/bastyon-rns" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon — значок в трее на Windows и Linux (src/tray.rs).
# 2.11.6 и новее: исправления GHSA-7gmj-67g7-phm9 и GHSA-w28w-mhc8-qvjv.
# Внутренние крейты (tauri-runtime-wry, wry, tao, tauri-utils…) закреплены в
# Cargo.lock на линейке 2.11: 2.11 объявляет их через ^, и простой
# `cargo update` подтянул бы крейты 2.12. На 2.12 переходить целиком.
tauri = { version = "2.11.6", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tokio = { version = "1", features = ["full"] }

# --- Tor stack ---
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
http = "1"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
zip = "2"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
url = "2"
dashmap = "6"
once_cell = "1"
thiserror = "1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Размер и позиция окна между запусками (десктоп).
tauri-plugin-window-state = "2"
# Автозапуск при входе в систему (десктоп).
tauri-plugin-autostart = "2"
# Голосовой ввод (src/asr): запись с микрофона. На Linux нужен libasound2-dev.
cpal = "0.18"
# Mesh-сети (src/radio): байты до LoRa-радио по USB-serial и Bluetooth LE.
# serialport без libudev: на Linux порты перечисляются через sysfs, и сборке
# не нужен libudev-dev. btleplug на Linux идёт через BlueZ (libdbus уже нужен).
serialport = { version = "4.10", default-features = false }
btleplug = "0.13"
uuid = "1"
# Обновление изнутри приложения (use-app-update): скачать подписанную сборку
# из релиза, поставить поверх и перезапуститься. Версии закреплены: следующие
# требуют tauri 2.12, а связка 2.11 держится Cargo.lock.
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
# reqwest 0.13 нужен только апдейтеру. Фича `socks` — чтобы при включённом Tor
# проверка и загрузка обновления шли через Tor, а не напрямую (V20).
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["socks"] }

# Голосовой ввод: распознавание whisper.cpp прямо на устройстве. ggml
# собирается переносимо (GGML_NATIVE=OFF в .cargo/config.toml), на macOS
# считает Metal. Логи whisper.cpp идут в log.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal", "log_backend"] }
# Диктовка не усыпляется App Nap (src/asr/keep_awake.rs). Версии — те же,
# что уже тянет Tauri.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["log_backend"] }

# Linux: до создания значка в трее проверяем, что appindicator вообще есть
# (иначе tray-icon паникует). Та же версия, что уже тянет tray-icon.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.7"

# Mock-рантайм Tauri для теста ACL (acl_tests в src/lib.rs).
[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }

# Радио-слой: снять HUPCL с порта (src/radio/serial.rs); в тестах — openpty.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Криптография Reticulum (штампы LXMF, подписи) и в debug-сборке — с
# оптимизацией: без неё штамп узла доставки считается минутами.
[profile.dev.package.rns-crypto]
opt-level = 2

[profile.dev.package.rns-core]
opt-level = 2

# rns-net и rns-crypto с правками Bastyon (ресурсы и keepalive как у Python,
# файлы NomadNet, ключ из сети без паники) — те же версии, на которых
# закреплён lxmf-rs.
[patch.crates-io]
rns-net = { path = "vendor/rns-net" }
rns-crypto = { path = "vendor/rns-crypto" }
