[package]
name = "bastyon-rns-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Узел Reticulum для Android: libbastyon_rns_jni.so, которую грузит плагин
# MeshRnsPlugin (android/, пакет plugins.radio). Собирает scripts/build-rns-android.sh.
[lib]
name = "bastyon_rns_jni"
crate-type = ["cdylib"]

[dependencies]
bastyon-rns = { path = "../bastyon-rns" }
jni = "0.21"
log = "0.4"
serde = "1"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
