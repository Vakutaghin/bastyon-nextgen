[package]
name = "bastyon-rns"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
hex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }

# rns-net собирается только под unix. lxmf-rs ещё не выпущен на crates.io в
# версии для rns-net 0.5 — из git, на закреплённом коммите; rns-* — ровно те
# версии, под которые он собран.
[target.'cfg(unix)'.dependencies]
rns-net = "=0.5.10"
rns-core = "=0.1.13"
rns-crypto = "=0.1.8"
lxmf-rs = { git = "https://github.com/lelloman/lxmf-rs", rev = "e84fe344719c4b47aea2f300747b8c943fa1bbd0" }
lxmf-core = { git = "https://github.com/lelloman/lxmf-rs", rev = "e84fe344719c4b47aea2f300747b8c943fa1bbd0" }

[dev-dependencies]
serde_json = "1"
