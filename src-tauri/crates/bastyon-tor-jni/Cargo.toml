[package]
name = "bastyon-tor-jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# Tor для Android: libbastyon_tor_jni.so, которую грузит плагин TorPlugin
# (android/, пакет plugins.tor). Сам tor и lyrebird — программы из
# tor-expert-bundle в APK. Собирает scripts/build-tor-android.sh.
[lib]
name = "bastyon_tor_jni"
crate-type = ["cdylib"]

[dependencies]
bastyon-tor = { path = "../bastyon-tor" }
futures-util = "0.3"
jni = "0.21"
log = "0.4"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
